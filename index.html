<!doctype html>
<html lang="fr">

<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" type="text/css" media="screen" href="./site_css/theme.css">

<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top site-nav">
    <div class="container">
      <a class="navbar-brand" href="#home" data-route="home">
        <span class="brand-mark">LR</span>
        Lux Reginae
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Afficher la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="main-navigation"></ul>
      </div>
    </div>
  </nav>

  <header class="site-hero">
    <img src="./site_img/banner.png" alt="Bannière Lux Reginae" class="site-hero__image">

        <p class="eyebrow">Compagnie Libre francophone</p>
        <h1>Lux Reginae</h1>

          <a class="btn btn-primary btn-lg" href="#join" data-route="join">

            Nous rejoindre
          </a>
          <a class="btn btn-outline-light btn-lg" href="#agenda" data-route="agenda">
            <i class="bi bi-calendar-event"></i>
            Voir le planning
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="app" class="site-main" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <span>Lux Reginae - Chaos / Moogle</span>
      <a href="https://eu.finalfantasyxiv.com/lodestone/freecompany/9233364398528184114/" target="_blank"
        rel="noreferrer">Profil Lodestone</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
